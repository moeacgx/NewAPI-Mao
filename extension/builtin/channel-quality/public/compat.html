<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>渠道可观测性中心</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        color: CanvasText;
        background: Canvas;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(560px, calc(100% - 32px));
        padding: 24px;
        border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
        border-radius: 8px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0;
        color: color-mix(in srgb, CanvasText 68%, transparent);
        font-size: 14px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>模块依赖未就绪</h1>
      <p>
        渠道可观测性需要宿主原生 UI SDK 和渠道统计接口。请确认对应能力已启用，
        然后重新打开模块。
      </p>
    </main>
  </body>
</html>
